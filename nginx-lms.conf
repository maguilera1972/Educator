# Configuration Nginx optionnelle pour LMS-Educator
# Non requis si vous utilisez Cloudflare Tunnel (cloudflared) directement vers le port 3000.
# Utile uniquement si Nginx fait proxy local avant cloudflared.

server {
    listen 80;
    server_name _;

    # Aucune limite de taille pour les uploads (slides, videos, docs, labs)
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longs pour les gros fichiers
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
