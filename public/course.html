<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/images/favicon.png" data-app-favicon>
  <title>Courses — ALSO LMS</title>
  <link rel="stylesheet" href="/css/style.css?v=61">
  <script src="/js/config.js?v=5"></script>
  <script src="/js/i18n.js?v=5"></script>
  <script src="/js/i18n-catalog.js?v=1"></script>
</head>
<body data-page-title-key="nav.courses" data-page-title="Courses">
  <header class="header">
    <div class="container">
      <a href="/" class="logo brand-logo">
        <img src="/images/logo-emblem.svg" alt="" class="logo-emblem" data-app-logo-emblem aria-hidden="true">
        <span class="logo-wordmark"><span class="logo-wordmark-lms">LMS</span><span class="logo-wordmark-educator">-Educator</span></span>
      </a>
      <nav>
        <a href="/courses.html" id="nav-courses" data-i18n="nav.courses">Courses</a>
        <a href="/dashboard.html" id="nav-dashboard" data-i18n="nav.dashboard">Dashboard</a>
        <a href="/admin.html" id="nav-admin" style="display:none" data-i18n="nav.admin">Administration</a>
        <a href="https://also.eureka-training.online/feedback" id="nav-feedback" class="nav-feedback" target="_blank" rel="noopener noreferrer" data-i18n="nav.feedback" title="Report a bug or request a feature (opens portal)">Feedback</a>
        <span id="nav-user" class="nav-user"></span>
        <a href="#" id="logout-btn" class="nav-logout" hidden data-i18n="nav.logout">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <div id="loading" class="muted" data-i18n="course.loading">Loading…</div>
    <div id="content" hidden>
      <div class="section-header">
        <div>
          <h2 id="course-title"></h2>
          <p id="course-desc" class="muted"></p>
          <p id="course-meta" class="meta"></p>
        </div>
        <div class="header-actions" id="course-actions"></div>
      </div>

      <section id="enroll-banner" class="banner" hidden>
        <p id="enroll-banner-text" data-i18n="course.enrollBanner">This training will be assigned to you by your administrator.</p>
      </section>

      <section id="materials-section">
        <div class="section-header">
          <h3 data-i18n="course.materials">Training materials</h3>
        </div>
        <div id="materials-grid" class="materials-grid"></div>
      </section>

      <section id="modules-section">
        <div class="section-header">
          <h3 data-i18n="course.modules">Modules</h3>
          <button class="btn-primary btn-sm" id="add-module-btn" hidden data-i18n="course.addModule">+ Module</button>
        </div>
        <div id="modules-list"></div>
      </section>

      <section id="evaluation-section" class="evaluation-section" hidden>
        <div class="card evaluation-card">
          <div class="evaluation-card-body">
            <h3 data-i18n="course.evaluation">Training evaluation</h3>
            <p class="muted" data-i18n="course.evaluationHint">Your feedback helps us improve future sessions. The form opens in a new tab.</p>
          </div>
          <a
            id="evaluation-form-link"
            class="btn-primary"
            href="https://forms.cloud.microsoft/e/RFjBKzfwQQ"
            target="_blank"
            rel="noopener noreferrer"
           data-i18n="course.evaluationOpen">Open evaluation form</a>
        </div>
      </section>
    </div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-content card">
      <h3 id="modal-title"></h3>
      <form id="modal-form" method="post" enctype="multipart/form-data" action="#"></form>
      <div class="form-actions" id="modal-actions">
        <button type="submit" form="modal-form" class="btn-primary" data-i18n="course.save">Save</button>
        <button type="button" class="btn-secondary" id="modal-cancel" data-i18n="course.cancel">Cancel</button>
      </div>
      <p id="modal-error" class="status error" hidden></p>
    </div>
  </div>

  <script src="/js/avatars-ui.js?v=5"></script>
  <script src="/js/profile-hover.js?v=1"></script>
  <script src="/js/api.js?v=12"></script>
  <script src="/js/sidebar.js?v=19"></script>
  <script src="/js/sidebar-weather.js?v=4"></script>
  <script src="/js/course.js?v=12"></script>
</body>
</html>
