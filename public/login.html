<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/images/favicon.png" data-app-favicon>
  <title>Connexion — LMS-Educator</title>
  <link rel="stylesheet" href="/css/style.css?v=55">
  <script src="/js/config.js?v=3"></script>
  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/i18n-catalog.js?v=1"></script>
</head>
<body data-page-title-key="login.title" data-page-title="Connexion" class="auth-layout">
  <header class="header header--minimal">
    <div class="container">
      <nav><a href="/register.html" data-i18n="nav.createAccount">Créer un compte</a></nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-panel">
      <a href="/" class="auth-logo brand-logo">
        <img src="/images/logo-emblem.svg" alt="" class="logo-emblem" data-app-logo-emblem aria-hidden="true">
        <span class="logo-wordmark"><span class="logo-wordmark-lms">LMS</span><span class="logo-wordmark-educator">-Educator</span></span>
      </a>
      <form class="auth-form card" id="login-form">
      <h2 data-i18n="login.title">Connexion</h2>
      <p id="session-hint" class="status ok" hidden></p>
      <div class="field">
        <label for="email" data-i18n="login.email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password" data-i18n="login.password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <p id="error" class="status error" hidden></p>
      <button type="submit" class="btn-primary btn-block" data-i18n="login.submit">Se connecter</button>
      <p class="auth-link"><span data-i18n="login.noAccount">Pas encore de compte ?</span> <a href="/register.html" data-i18n="login.signUp">S'inscrire</a></p>
      </form>
    </div>
  </main>

  <script src="/js/api.js?v=11"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const nextUrl = params.get('next') || '/dashboard.html';
    const reason = params.get('reason');
    const hint = document.getElementById('session-hint');
    if (reason === 'session') {
      hint.textContent = (typeof t === 'function' ? t('login.sessionExpired') : 'Votre session a expiré ou a été réinitialisée. Veuillez vous reconnecter.');
      hint.hidden = false;
      API.clearToken();
    }

    if (API.getToken() && reason !== 'session') {
      window.location.href = nextUrl.startsWith('/') ? nextUrl : '/dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error');
      errEl.hidden = true;
      try {
        await API.login(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        window.location.href = nextUrl.startsWith('/') ? nextUrl : '/dashboard.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.hidden = false;
      }
    });
  </script>
</body>
</html>
