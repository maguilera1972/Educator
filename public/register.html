<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/images/favicon.png" data-app-favicon>
  <title>Register — ALSO LMS</title>
  <link rel="stylesheet" href="/css/style.css?v=58">
  <script src="/js/config.js?v=4"></script>
  <script src="/js/i18n.js?v=4"></script>
  <script src="/js/i18n-catalog.js?v=1"></script>
</head>
<body data-page-title-key="nav.register" data-page-title="Register" class="auth-layout no-sidebar">
  <header class="header">
    <div class="container">
      <a href="/" class="logo brand-logo">
        <img src="/images/logo-emblem.svg" alt="" class="logo-emblem" data-app-logo-emblem aria-hidden="true">
        <span class="logo-wordmark"><span class="logo-wordmark-lms">LMS</span><span class="logo-wordmark-educator">-Educator</span></span>
      </a>
      <nav><a href="/login.html" data-i18n="nav.login">Log in</a></nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-panel">
      <form class="auth-form card" id="register-form">
        <h2 data-i18n="register.title">Create an account</h2>
        <div class="field-row">
          <div class="field">
            <label for="first-name" data-i18n="register.firstName">First name</label>
            <input type="text" id="first-name" required autocomplete="given-name">
          </div>
          <div class="field">
            <label for="last-name" data-i18n="register.lastName">Last name</label>
            <input type="text" id="last-name" required autocomplete="family-name">
          </div>
        </div>
        <div class="field">
          <label for="email" data-i18n="register.email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field" id="company-field">
          <label for="company" data-i18n="register.company">Company</label>
          <input type="text" id="company" name="company" maxlength="120" autocomplete="organization" placeholder="Your company name" data-i18n-placeholder="register.companyPlaceholder">Your company name<p class="muted upload-hint" id="company-hint" data-i18n="register.companyHint">Required for learners — enter the company for which you are taking the training.</p>
        </div>
        <div class="field">
          <label for="password" data-i18n="register.password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="role" data-i18n="register.profile">Profile</label>
          <select id="role">
            <option value="learner" data-i18n="register.roleLearner">Learner</option>
            <option value="instructor" data-i18n="register.roleInstructor">Instructor (admin approval required)</option>
          </select>
          <p class="muted upload-hint" id="instructor-hint" hidden data-i18n="register.instructorHint">Instructor registrations must be approved by an administrator who will assign the courses to teach.</p>
        </div>
        <p id="error" class="status error" hidden></p>
        <button type="submit" class="btn-primary btn-block" data-i18n="register.submit">Sign up</button>
        <p class="auth-link"><span data-i18n="register.hasAccount">Already registered?</span> <a href="/login.html" data-i18n="register.signIn">Log in</a></p>
      </form>
    </div>
  </main>

  <script src="/js/api.js?v=12"></script>
  <script>
    if (API.getToken()) window.location.href = '/dashboard.html';

    function syncCompanyField() {
      const isLearner = document.getElementById('role').value === 'learner';
      const companyInput = document.getElementById('company');
      const companyHint = document.getElementById('company-hint');
      companyInput.required = isLearner;
      companyHint.hidden = !isLearner;
      if (!isLearner) companyInput.value = companyInput.value; // keep value if switching back
    }

    document.getElementById('role').addEventListener('change', (e) => {
      document.getElementById('instructor-hint').hidden = e.target.value !== 'instructor';
      syncCompanyField();
    });
    syncCompanyField();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error');
      errEl.hidden = true;
      try {
        const firstName = document.getElementById('first-name').value.trim();
        const lastName = document.getElementById('last-name').value.trim();
        const role = document.getElementById('role').value;
        const company = document.getElementById('company').value.trim();
        if (role === 'learner' && !company) {
          throw new Error(typeof t === 'function' ? t('register.companyRequired') : 'Enter your company');
        }
        const data = await API.register({
          first_name: firstName,
          last_name: lastName,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role,
          company,
        });
        if (data.pending_approval && data.message) {
          alert(data.message);
        }
        window.location.href = '/dashboard.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.hidden = false;
      }
    });
  </script>
</body>
</html>
