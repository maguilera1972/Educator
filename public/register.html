<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/images/favicon.png" data-app-favicon>
  <title>Register — ALSO LMS</title>
  <link rel="stylesheet" href="/css/style.css?v=60">
  <script src="/js/config.js?v=5"></script>
  <script src="/js/i18n.js?v=4"></script>
  <script src="/js/i18n-catalog.js?v=1"></script>
</head>
<body data-page-title-key="nav.register" data-page-title="Register" class="auth-layout no-sidebar">
  <header class="header">
    <div class="container">
      <a href="/" class="logo brand-logo">
        <img src="/images/logo-emblem.svg" alt="" class="logo-emblem" data-app-logo-emblem aria-hidden="true">
        <span class="logo-wordmark"><span class="logo-wordmark-lms">LMS</span><span class="logo-wordmark-educator">-Educator</span></span>
      </a>
      <nav><a href="/login.html" data-i18n="nav.login">Log in</a></nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-panel">
      <form class="auth-form card" id="register-form">
        <h2 data-i18n="register.title">Create an account</h2>
        <p class="muted upload-hint">
          Your ALSO portal profile is the source of identity. Use the same @also.com email.
          No portal account yet?
          <a id="portal-register-link" href="https://also.eureka-training.online/register">Register on the portal</a>.
        </p>
        <div class="field">
          <label for="email" data-i18n="register.email">Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@also.com">
        </div>
        <div class="field">
          <label for="password" data-i18n="register.password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
          <p class="muted upload-hint">LMS login password (portal name and profile are applied automatically).</p>
        </div>
        <p id="error" class="status error" hidden></p>
        <button type="submit" class="btn-primary btn-block" data-i18n="register.submit">Sign up</button>
        <p class="auth-link"><span data-i18n="register.hasAccount">Already registered?</span> <a href="/login.html" data-i18n="register.signIn">Log in</a></p>
      </form>
    </div>
  </main>

  <script src="/js/api.js?v=12"></script>
  <script>
    if (API.getToken()) window.location.href = '/dashboard.html';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error');
      errEl.hidden = true;
      try {
        const data = await API.register({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role: 'learner',
        });
        window.location.href = data.pending_approval ? '/dashboard.html' : '/dashboard.html';
      } catch (err) {
        let msg = err.message || 'Registration failed';
        if (err.payload && err.payload.portal_register_url) {
          msg += ' — open the portal registration page.';
          const link = document.getElementById('portal-register-link');
          if (link) link.href = err.payload.portal_register_url;
        }
        errEl.textContent = msg;
        errEl.hidden = false;
      }
    });
  </script>
</body>
</html>
