<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="LMS-Educator">
  <defs>
    <linearGradient id="swooshGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C85A0A"/>
      <stop offset="45%" stop-color="#F0781A"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <radialGradient id="tabletGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#F0781A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0781A" stop-opacity="0"/>
    </radialGradient>
    <filter id="swooshGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" fill="#FFFFFF"/>

  <!-- Globe grid -->
  <g id="globe" stroke="#1B3A5C" fill="none">
    <circle cx="64" cy="64" r="40" stroke-width="3.5"/>
    <ellipse cx="64" cy="64" rx="40" ry="14" stroke-width="2.2"/>
    <ellipse cx="64" cy="64" rx="14" ry="40" stroke-width="2.2"/>
    <ellipse cx="64" cy="64" rx="28" ry="40" stroke-width="1.4" opacity="0.55"/>
    <ellipse cx="64" cy="64" rx="40" ry="28" stroke-width="1.4" opacity="0.55"/>
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="28s" repeatCount="indefinite"/>
  </g>

  <!-- Tablet -->
  <g id="tablet">
    <ellipse cx="34" cy="88" rx="24" ry="18" fill="url(#tabletGlow)"/>
    <rect x="18" y="74" width="32" height="24" rx="4.5" fill="#F0781A"/>
    <rect x="21" y="77" width="26" height="18" rx="3" fill="#FFF7EE"/>
    <circle cx="34" cy="86" r="2.4" fill="#1B3A5C"/>
    <path d="M34 86 V91.5 M30.5 88.5 H37.5" stroke="#1B3A5C" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M27 82 H41 M27 90 H36" stroke="#F0781A" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <circle cx="27" cy="82" r="1.3" fill="#F0781A"/>
    <circle cx="41" cy="82" r="1.3" fill="#F0781A"/>
    <circle cx="27" cy="90" r="1.3" fill="#F0781A"/>
    <circle cx="36" cy="90" r="1.3" fill="#F0781A"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.2; 0 0" dur="3.8s" repeatCount="indefinite"/>
  </g>

  <!-- Graduation cap -->
  <g id="cap">
    <path d="M78 30 L98 22 L94 34 Z" fill="#F0781A"/>
    <rect x="86" y="22" width="18" height="4" rx="1" fill="#F0781A" transform="rotate(16 95 24)"/>
    <path d="M88 36 L64 42 L40 36 L64 28 Z" fill="#F0781A"/>
    <rect x="62" y="42" width="4" height="8" fill="#D96810"/>
    <circle cx="66" cy="51" r="2.4" fill="#F0781A"/>
    <animateTransform attributeName="transform" type="rotate" values="-3 64 36; 3 64 36; -3 64 36" dur="4.5s" repeatCount="indefinite"/>
  </g>

  <!-- Swoosh + particles -->
  <g id="swoosh" filter="url(#swooshGlow)">
    <path d="M34 88 C52 68 78 52 98 42" fill="none" stroke="url(#swooshGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <rect x="95" y="38" width="4.5" height="4.5" fill="#F0781A" rx="0.5">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="101" y="43" width="3.5" height="3.5" fill="#FFB347" rx="0.5">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="84" width="3" height="3" fill="#FFB347" rx="0.5" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" repeatCount="indefinite"/>
  </g>
</svg>
